apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliente-pet-api
  namespace: cliente-pet
  labels:
    app: cliente-pet-api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cliente-pet-api
  template:
    metadata:
      labels:
        app: cliente-pet-api
        version: v1
    spec:
      containers:
      - name: cliente-pet-api
        image: eliseusan/cliente-pet:pr-b38f703
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: cliente-pet-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /cliente-pet/api
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /cliente-pet/api
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        imagePullPolicy: Always 